name: Upgrade DOMPurify

on:
  push:
    paths:
      - '.github/workflows/upgrade-dompurify.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Refresh DOMPurify dependency and lockfile
        run: npm install 'dompurify@3.4.0' --save-exact --package-lock-only --ignore-scripts

      - name: Verify resolved DOMPurify version
        run: |
          node -e "const pkg=require('./package.json'); const lock=require('./package-lock.json'); const v=lock.packages?.['node_modules/dompurify']?.version; if (pkg.dependencies?.dompurify !== '3.4.0' || v !== '3.4.0') { throw new Error('Expected package and lock at dompurify 3.4.0; got ' + pkg.dependencies?.dompurify + ' / ' + v) }"

      - name: Commit dependency upgrade
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Dependency already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'fix(security): upgrade DOMPurify to 3.4.0'
          git push origin HEAD:main
